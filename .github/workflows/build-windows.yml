# 云端自动打包 Windows 安装包，打完自动上传到你的 R2 发布桶。
# 触发方式：GitHub 网页上手动点「Run workflow」，或推送 v 开头的标签。
name: 打包 Windows 安装包

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

env:
  R2_ENDPOINT: https://0f98b7eaabb1ca07dadca32e7e34ddb0.r2.cloudflarestorage.com
  PUBLIC_BASE: https://pub-ec88f35bbc9845e098c534da6f88fdfc.r2.dev
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_S3_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 从 R2 下载 Codex 运行时（大文件用 aws 分片，不放 GitHub）
        run: |
          aws configure set default.s3.addressing_style path
          aws s3 cp s3://banshan-releases/runtime/codex.exe src-tauri/resources/codex-runtime/codex.exe --endpoint-url $env:R2_ENDPOINT

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 打包安装包
        env:
          BSAIGC_INTERNAL_API_KEY: ${{ secrets.BSAIGC_INTERNAL_API_KEY }}
        run: pnpm tauri build --bundles nsis

      - name: 读取版本号
        id: ver
        shell: pwsh
        run: echo "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      - name: 上传安装包与版本信息到 R2
        shell: pwsh
        run: |
          aws configure set default.s3.addressing_style path
          $ver = "${{ steps.ver.outputs.version }}"
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $name = "banshan-workbench-$ver-setup.exe"
          aws s3 cp $exe.FullName "s3://banshan-releases/$name" --endpoint-url $env:R2_ENDPOINT
          @{ version = $ver; url = "$env:PUBLIC_BASE/$name"; notes = "版本 $ver" } | ConvertTo-Json | Set-Content -Encoding UTF8 version.json
          aws s3 cp version.json "s3://banshan-releases/version.json" --endpoint-url $env:R2_ENDPOINT --content-type application/json

      - name: 留存安装包（可在 GitHub 网页下载）
        uses: actions/upload-artifact@v4
        with:
          name: banshan-workbench-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
